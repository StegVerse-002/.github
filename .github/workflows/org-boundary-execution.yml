name: Org Boundary Execution
on:
  push:
    paths: ['org-boundary/**','tests/test_self_characterization_hierarchical_ledger.py','.github/workflows/org-boundary-execution.yml']
  pull_request:
    paths: ['org-boundary/**','tests/test_self_characterization_hierarchical_ledger.py','.github/workflows/org-boundary-execution.yml']
  workflow_dispatch:
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 org-boundary/tests/test_process_boundary.py
      - run: python3 -m unittest -v tests.test_self_characterization_hierarchical_ledger
