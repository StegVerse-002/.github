name: Organization Ledger Transition

# Validation only. The dispatched intr-destination diagnostic self-closure
# this workflow used to run is retired: it addressed this organization's own
# intr-destination, an InTr hop inside one organization, and InTr paths exist only
# between distinct organizations (Rigel's rule, 2026-10-25; the same removal as
# StegVerse-org/.github and SV-LLM/.github#62). This organization's ledger is
# appended by .github/workflows/organization-ledger-writer.yml on push, never by
# a self-closure. The ledger is the evidence; this run's success is not.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/organization-ledger-transition.yml'
      - '.stegverse/transition-ledger/**'
      - 'resident-runtime/ledger_store.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/organization_ledger_readback.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'resident-runtime/organization_egress_boundary.py'
      - 'tests/test_git_ledger_store.py'
      - 'tests/test_organization_ledger_published_ref.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/organization-ledger-transition.yml'
      - '.stegverse/transition-ledger/**'
      - 'resident-runtime/ledger_store.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/organization_ledger_readback.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'resident-runtime/organization_egress_boundary.py'
      - 'tests/test_git_ledger_store.py'
      - 'tests/test_organization_ledger_published_ref.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Ledger store, published-ref binding, and intr-destination capability
        run: |
          python3 -m py_compile \
            resident-runtime/ledger_store.py \
            resident-runtime/aggregate_repo_transition.py \
            resident-runtime/organization_ledger_readback.py \
            resident-runtime/intr_destination_ingress.py \
            .stegverse/transition-ledger/emit.py
          python3 -m unittest -v \
            tests.test_git_ledger_store \
            tests.test_organization_ledger_published_ref \
            tests.test_intr_destination_capability
