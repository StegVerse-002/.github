name: Validate InTr Destination Capability

on:
  pull_request:
    branches: [main]
    paths:
      - 'org-boundary/runtime/capability_ingress.py'
      - 'org-boundary/registry/services.json'
      - 'org-kernel/kernel.py'
      - 'org-runtime/interlock-intr.json'
      - 'org-runtime/runtime_boundary.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'resident-runtime/organization_egress_boundary.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - '.stegverse/transition-ledger/emit.py'
      - 'tests/test_intr_destination_capability.py'
      - 'tests/test_ledger_writer_supplied_epoch.py'
      - 'tests/test_epoch_clock_marker.py'
      - 'tests/test_manifest_epoch_bindings.py'
      - '.github/workflows/resident-federation-cycle.yml'
      - 'resident-runtime/activation-manifest.json'
      - 'resident-runtime/systemd/stegverse-002-resident.service'
      - 'org-boundary/runtime/process_boundary.py'
      - 'resident-runtime/federation_cycle.py'
      - 'resident-runtime/federation_gateway_transport.py'
      - 'docs/INTR_DESTINATION_CAPABILITY_MIRROR_HANDOFF.md'
      - '.github/workflows/intr-destination-capability-validation.yml'
  push:
    branches: [main]
    paths:
      - 'org-boundary/runtime/capability_ingress.py'
      - 'org-boundary/registry/services.json'
      - 'org-kernel/kernel.py'
      - 'org-runtime/interlock-intr.json'
      - 'org-runtime/runtime_boundary.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'resident-runtime/organization_egress_boundary.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - '.stegverse/transition-ledger/emit.py'
      - 'tests/test_intr_destination_capability.py'
      - 'tests/test_ledger_writer_supplied_epoch.py'
      - 'tests/test_epoch_clock_marker.py'
      - 'tests/test_manifest_epoch_bindings.py'
      - '.github/workflows/resident-federation-cycle.yml'
      - 'resident-runtime/activation-manifest.json'
      - 'resident-runtime/systemd/stegverse-002-resident.service'
      - 'org-boundary/runtime/process_boundary.py'
      - 'resident-runtime/federation_cycle.py'
      - 'resident-runtime/federation_gateway_transport.py'
      - 'docs/INTR_DESTINATION_CAPABILITY_MIRROR_HANDOFF.md'
      - '.github/workflows/intr-destination-capability-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-intr-destination:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: The boundary enforces the advertised address and the served set
        run: |
          python org-runtime/runtime_boundary.py validate > boundary.json
          python - <<'PY'
          import json
          report = json.load(open("boundary.json"))
          assert report["valid"] is True, report["checks"]
          assert report["checks"]["capability_addresses_resolve"] is True
          assert report["checks"]["peer_capability_addresses_derive"] is True
          assert report["checks"]["intr_egress_binding_present"] is True
          print("INTR_DESTINATION_ADDRESS_ENFORCED=PASS", len(report["checks"]), "checks")
          PY

      # Both ledgers are durable sovereign state. A run that appended into
      # either default location would be writing runtime reality from CI.
      # The mesh the unittest opens is a temporary directory, not an operator mesh.
      # The far side is this repository's kernel receipt and control response.
      # That proves emit and close against a fabricated answer. It does not
      # prove a live peer installed the capability, and it is not an authentic receipt.
      - name: Validate advertise, address, resolve, emit, and close
        env:
          STEGVERSE_REPO_LEDGER_ROOT: ${{ runner.temp }}/repo-ledger
          STEGVERSE_ORG_LEDGER_ROOT: ${{ runner.temp }}/org-ledger
        run: python -m unittest tests.test_intr_destination_capability -v

      # Both writers refuse an absent or invalid epoch before the store opens.
      - name: Validate the ledger writers take only a supplied epoch
        env:
          STEGVERSE_REPO_LEDGER_ROOT: ${{ runner.temp }}/repo-ledger
          STEGVERSE_ORG_LEDGER_ROOT: ${{ runner.temp }}/org-ledger
        run: python -m unittest tests.test_ledger_writer_supplied_epoch -v

      # The clock is fixed and counted in every subprocess. Each consuming route
      # refuses an absent epoch before any write, stamps a supplied one, and
      # leaves no clock value unmarked.
      - name: Validate no consuming route takes its time from the clock
        run: python -m unittest tests.test_epoch_clock_marker -v

      # Every manifest-declared entrypoint that needs an epoch declares its binding,
      # and the declared supplier passes it (MANIFEST_ENTRYPOINT_LACKS_EPOCH_BINDING).
      - name: Validate every epoch-requiring entrypoint is bound in its manifest
        run: python -m unittest tests.test_manifest_epoch_bindings -v
